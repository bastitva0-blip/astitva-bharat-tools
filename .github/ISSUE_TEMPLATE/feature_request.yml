name: Feature request
description: Suggest an improvement to an existing tool, or a non-tool feature (UI, accessibility, performance, etc).
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For a **brand-new tool**, please use the "New tool proposal" template instead — we have additional questions about scope and privacy for those.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do today, and where does the current product fall short?
      placeholder: |
        I'm preparing documents for an SSC application. The compressor lets me hit 100 KB, but I can't preview the file before downloading.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Be as concrete as you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways this could be solved, or workarounds you've used.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      multiple: true
      options:
        - Existing tool behavior
        - New preset (exam, KB target, print-sheet size, etc.)
        - UI / design system
        - Accessibility
        - Performance
        - Documentation
        - Build / tooling
        - Other
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: BharatTools processes everything on-device. Confirm your proposal fits that model.
      options:
        - label: My proposal can be implemented without uploading user files to a server or third-party API.
          required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have read the [Code of Conduct](../../blob/main/CODE_OF_CONDUCT.md).
          required: true
